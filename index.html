<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leipzig Ortsteile-Quiz</title>
<meta name="description" content="Lerne die Ortsteile Leipzigs – ein Kartenquiz im Stil von Seterra, wahlweise in 3D.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #0f1b2d;
    --panel: #ffffff;
    --ink: #14213d;
    --muted: #64748b;
    --accent: #e76f51;
    --accent-dark: #c9573b;
    --ok: #16a34a;
    --bad: #dc2626;
    --line: #e2e8f0;
    --radius: 14px;
    --shadow: 0 10px 30px rgba(15, 27, 45, .25);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; height: 100dvh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); background: var(--bg);
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #fbbf24; outline-offset: 2px; }

  /* ---------- Kopfzeile ---------- */
  #top {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--bg); color: #fff; min-height: 52px;
  }
  #top h1 { font-size: 1.05rem; margin: 0; letter-spacing: .2px; white-space: nowrap; }
  #top h1 span { color: #fbbf24; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; background: rgba(255,255,255,.12); border-radius: 999px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; color: #cbd5e1; padding: 6px 14px; border-radius: 999px; font-size: .88rem;
  }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 600; }
  .opacity { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: #cbd5e1; }
  .opacity input { width: 90px; accent-color: #fbbf24; }
  .ghost {
    border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff;
    padding: 6px 14px; border-radius: 999px; font-size: .88rem;
  }
  .ghost:hover { background: rgba(255,255,255,.12); }
  .ghost[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 600; }

  /* ---------- Karte ---------- */
  #stage { position: relative; flex: 1; min-height: 0; }
  #map { position: absolute; inset: 0; background: #dfe7ef; }
  .maplibregl-map { font-family: inherit; }
  #tip {
    position: absolute; z-index: 1100; pointer-events: none; display: none;
    background: rgba(15, 27, 45, .92); color: #fff; font-size: .82rem; padding: 4px 9px;
    border-radius: 6px; white-space: nowrap; transform: translate(12px, -120%);
  }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; z-index: 1200; top: 12px; left: 12px; width: min(390px, calc(100% - 24px));
    background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px;
  }
  [hidden] { display: none !important; }
  .hud-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .prompt small { display: block; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .6px; }
  .prompt strong { font-size: 1.35rem; line-height: 1.15; }
  .stats { display: flex; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; font-size: .92rem; white-space: nowrap; }
  .stats .ok { color: var(--ok); font-weight: 700; }
  .stats .bad { color: var(--bad); font-weight: 700; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; margin: 10px 0 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  #feedback { min-height: 1.3em; font-size: .92rem; margin-bottom: 6px; }
  #feedback.bad { color: var(--bad); }
  #feedback.ok { color: var(--ok); }
  .hud-row { display: flex; gap: 8px; }
  .hud-row + .hud-row { margin-top: 8px; }
  #ans { flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border: 2px solid var(--line); border-radius: 10px; }
  #ans:focus { border-color: var(--accent); outline: none; }
  .btn {
    border: 0; border-radius: 10px; padding: 9px 14px; background: var(--accent); color: #fff; font-weight: 600;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn.sec { background: #eef2f7; color: var(--ink); font-weight: 500; }
  .btn.sec:hover { background: #e1e8f0; }
  .hud-row.buttons .btn { flex: 1; padding: 7px 8px; font-size: .86rem; }

  /* ---------- Modal ---------- */
  #modal {
    position: absolute; inset: 0; z-index: 1300; display: flex; align-items: center; justify-content: center;
    padding: 14px; background: rgba(15, 27, 45, .45); overflow: auto;
  }
  .card {
    background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); width: min(520px, 100%);
    padding: 24px; max-height: 100%; overflow: auto;
  }
  .card h2 { margin: 0 0 4px; font-size: 1.45rem; }
  .card p { color: var(--muted); margin: 4px 0 14px; line-height: 1.45; }
  .modes { display: grid; gap: 8px; margin: 12px 0; }
  .mode {
    display: flex; gap: 12px; align-items: flex-start; padding: 11px 13px; border: 2px solid var(--line);
    border-radius: 12px; cursor: pointer;
  }
  .mode:has(input:checked) { border-color: var(--accent); background: #fff4f0; }
  .mode input { margin-top: 4px; accent-color: var(--accent); }
  .mode b { display: block; }
  .mode span { color: var(--muted); font-size: .86rem; }
  .field { display: flex; flex-direction: column; gap: 5px; margin: 12px 0; font-size: .9rem; }
  .field select { font: inherit; padding: 9px 10px; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
  .card .btn.big { width: 100%; padding: 13px; font-size: 1.05rem; margin-top: 10px; }
  .score-big { font-size: 3.4rem; font-weight: 800; line-height: 1; color: var(--accent); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; text-align: center; }
  .grid3 div { background: #f4f7fb; border-radius: 10px; padding: 8px 4px; }
  .grid3 b { display: block; font-size: 1.15rem; }
  .grid3 span { font-size: .76rem; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .chips span { background: #fee2e2; color: #991b1b; font-size: .82rem; padding: 3px 9px; border-radius: 99px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row .btn { flex: 1; }
  .note { font-size: .8rem; color: var(--muted); }
  .error { color: var(--bad); }
  .dropzone { border: 2px dashed var(--line); border-radius: 12px; padding: 14px; text-align: center; margin: 10px 0; }
  .spinner { width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 14px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    #top { gap: 8px; padding: 8px 10px; }
    #top h1 { font-size: .95rem; }
    .opacity { display: none; }
    #hud { top: auto; bottom: 26px; left: 8px; right: 8px; width: auto; }
    .prompt strong { font-size: 1.15rem; }
  }
</style>
</head>
<body>

<header id="top">
  <h1>Leipzig <span>Ortsteile-Quiz</span></h1>
  <div class="spacer"></div>
  <div class="opacity"><label for="opac">Deckkraft</label><input id="opac" type="range" min="0" max="90" value="50"></div>
  <div class="seg" role="group" aria-label="Hintergrundkarte">
    <button id="bmTopo" type="button" aria-pressed="false">Topografisch</button>
    <button id="bmStyle" type="button" aria-pressed="true">Stilisiert</button>
  </div>
  <button id="btn3d" class="ghost" type="button" aria-pressed="false" title="Geneigte 3D-Ansicht mit Gebäuden (ab Zoomstufe 13 sichtbar)">3D</button>
  <button id="menuBtn" class="ghost" type="button">Menü</button>
</header>

<main id="stage">
  <div id="map"></div>
  <div id="tip"></div>

  <section id="hud" hidden aria-live="polite">
    <div class="hud-top">
      <div class="prompt"><small id="promptLbl">Finde</small><strong id="target">–</strong></div>
      <div class="stats">
        <span class="ok" title="Auf Anhieb richtig">✔ <span id="sOk">0</span></span>
        <span class="bad" title="Fehlversuche">✖ <span id="sBad">0</span></span>
        <span id="sProg">0/0</span>
        <span id="sTime">0:00</span>
      </div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div id="feedback"></div>
    <div class="hud-row" id="typeRow" hidden>
      <input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Name des markierten Ortsteils …" aria-label="Name des markierten Ortsteils">
      <button id="submitBtn" class="btn" type="button">OK</button>
    </div>
    <div class="hud-row buttons">
      <button id="hintBtn" class="btn sec" type="button">Tipp</button>
      <button id="skipBtn" class="btn sec" type="button">Überspringen</button>
      <button id="endBtn" class="btn sec" type="button">Beenden</button>
    </div>
  </section>

  <div id="modal">
    <div class="card" id="card"></div>
  </div>
</main>

<noscript><p style="color:#fff;padding:20px">Dieses Spiel benötigt JavaScript.</p></noscript>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function () {
  'use strict';

  /* =====================================================================
   *  Konfiguration
   * ===================================================================== */
  var MAX_TRIES = 3;
  var LOCAL_FILE = 'ortsteile.geojson';     // optional: schnellere Variante, siehe "Kartendaten speichern" im Menü
  var CACHE_KEY = 'lpz-geo-v2';
  // Overpass-Server (OpenStreetMap-Daten, dürfen von jeder Webseite aus abgerufen werden)
  var OVERPASS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.private.coffee/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter'
  ];
  var OVERPASS_QUERY =
    '[out:json][timeout:90];' +
    'area["wikidata"="Q2079"]["boundary"="administrative"]->.a;' +
    'rel(area.a)["boundary"="administrative"]["admin_level"~"^(9|10)$"];' +
    'out geom;';
  var PALETTE = ['#e76f51', '#2a9d8f', '#e9c46a', '#8ab17d', '#4d908e', '#9b72aa', '#f4a261', '#577590', '#c1666b', '#6d9dc5'];

  // Vektorkarten von OpenFreeMap (kostenlos, ohne Schlüssel); Beschriftungen werden entfernt
  var STYLE_URL = {
    topo: 'https://tiles.openfreemap.org/styles/liberty',
    style: 'https://tiles.openfreemap.org/styles/positron'
  };
  var FALLBACK_STYLE = {
    version: 8,
    sources: { r: { type: 'raster', tileSize: 256, maxzoom: 18,
      tiles: ['https://a.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png', 'https://b.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}.png'],
      attribution: '© OpenStreetMap-Mitwirkende © CARTO' } },
    layers: [{ id: 'r', type: 'raster', source: 'r' }]
  };

  // Offizielle Gliederung – nur nötig, falls eine amtliche Datei als ortsteile.geojson hochgeladen wird
  var STATIC_BEZ = [
    { name: 'Mitte',    ot: ['Zentrum', 'Zentrum-Ost', 'Zentrum-Südost', 'Zentrum-Süd', 'Zentrum-West', 'Zentrum-Nordwest', 'Zentrum-Nord'] },
    { name: 'Nordost',  ot: ['Schönefeld-Abtnaundorf', 'Schönefeld-Ost', 'Mockau-Süd', 'Mockau-Nord', 'Thekla', 'Plaußig-Portitz'] },
    { name: 'Ost',      ot: ['Neustadt-Neuschönefeld', 'Volkmarsdorf', 'Anger-Crottendorf', 'Sellerhausen-Stünz', 'Paunsdorf', 'Heiterblick', 'Mölkau', 'Engelsdorf', 'Baalsdorf', 'Althen-Kleinpösna'] },
    { name: 'Südost',   ot: ['Reudnitz-Thonberg', 'Stötteritz', 'Probstheida', 'Meusdorf', 'Liebertwolkwitz', 'Holzhausen'] },
    { name: 'Süd',      ot: ['Südvorstadt', 'Connewitz', 'Marienbrunn', 'Lößnig', 'Dölitz-Dösen'] },
    { name: 'Südwest',  ot: ['Schleußig', 'Plagwitz', 'Kleinzschocher', 'Großzschocher', 'Knautkleeberg-Knauthain', 'Hartmannsdorf-Knautnaundorf'] },
    { name: 'West',     ot: ['Schönau', 'Grünau-Ost', 'Grünau-Mitte', 'Grünau-Siedlung', 'Lausen-Grünau', 'Grünau-Nord', 'Miltitz'] },
    { name: 'Alt-West', ot: ['Lindenau', 'Altlindenau', 'Neulindenau', 'Leutzsch', 'Böhlitz-Ehrenberg', 'Burghausen-Rückmarsdorf'] },
    { name: 'Nordwest', ot: ['Möckern', 'Wahren', 'Lützschena-Stahmeln', 'Lindenthal'] },
    { name: 'Nord',     ot: ['Gohlis-Süd', 'Gohlis-Mitte', 'Gohlis-Nord', 'Eutritzsch', 'Seehausen', 'Wiederitzsch'] }
  ];

  /* PURE:START ---------------------------------------------------------- */
  function norm(s) {
    return String(s).toLowerCase().replace(/ß/g, 'ss').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/[^a-z0-9]/g, '');
  }
  function norm2(s) {
    return String(s).toLowerCase().replace(/ß/g, 'ss').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  }
  function lev(a, b) {
    var m = a.length, n = b.length, i, j, prev, cur, tmp;
    if (!m) return n; if (!n) return m;
    prev = []; for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur = [i];
      for (j = 1; j <= n; j++) {
        tmp = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + tmp);
      }
      prev = cur;
    }
    return prev[n];
  }
  function tolerance(len) { return len >= 12 ? 2 : (len >= 5 ? 1 : 0); }
  function similar(typed, target) {
    var ts = [norm(typed), norm2(typed)], gs = [norm(target), norm2(target)], i, j;
    for (i = 0; i < ts.length; i++) {
      for (j = 0; j < gs.length; j++) {
        if (ts[i] && lev(ts[i], gs[j]) <= tolerance(gs[j].length)) return true;
      }
    }
    return false;
  }
  function exactly(typed, target) {
    return norm(typed) === norm(target) || norm2(typed) === norm2(target);
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function fmtTime(ms) {
    var s = Math.floor(ms / 1000), m = Math.floor(s / 60);
    s = s % 60; return m + ':' + (s < 10 ? '0' : '') + s;
  }

  /* ---------- Geometrie ---------- */
  function utmToLatLon(E, N, zone) {
    var a = 6378137.0, f = 1 / 298.257222101, k0 = 0.9996;
    var e2 = f * (2 - f), ep2 = e2 / (1 - e2);
    var x = E - 500000.0, y = N;
    var M = y / k0;
    var mu = M / (a * (1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 * e2 * e2 / 256));
    var e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
    var phi1 = mu
      + (3 * e1 / 2 - 27 * Math.pow(e1, 3) / 32) * Math.sin(2 * mu)
      + (21 * e1 * e1 / 16 - 55 * Math.pow(e1, 4) / 32) * Math.sin(4 * mu)
      + (151 * Math.pow(e1, 3) / 96) * Math.sin(6 * mu)
      + (1097 * Math.pow(e1, 4) / 512) * Math.sin(8 * mu);
    var s = Math.sin(phi1), c = Math.cos(phi1), t = Math.tan(phi1);
    var N1 = a / Math.sqrt(1 - e2 * s * s);
    var T1 = t * t, C1 = ep2 * c * c;
    var R1 = a * (1 - e2) / Math.pow(1 - e2 * s * s, 1.5);
    var D = x / (N1 * k0);
    var lat = phi1 - (N1 * t / R1) * (D * D / 2
      - (5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * ep2) * Math.pow(D, 4) / 24
      + (61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 252 * ep2 - 3 * C1 * C1) * Math.pow(D, 6) / 720);
    var lon0 = ((zone || 33) * 6 - 183) * Math.PI / 180;
    var lon = lon0 + (D
      - (1 + 2 * T1 + C1) * Math.pow(D, 3) / 6
      + (5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * ep2 + 24 * T1 * T1) * Math.pow(D, 5) / 120) / c;
    return [lon * 180 / Math.PI, lat * 180 / Math.PI];
  }
  function firstCoord(c) { while (Array.isArray(c[0])) c = c[0]; return c; }
  function mapCoords(c, fn) { return typeof c[0] === 'number' ? fn(c) : c.map(function (x) { return mapCoords(x, fn); }); }
  function eachCoord(c, fn) { if (typeof c[0] === 'number') fn(c); else c.forEach(function (x) { eachCoord(x, fn); }); }

  function ensureWgs84(fc) {
    var probe = null, i, g;
    for (i = 0; i < fc.features.length && !probe; i++) {
      g = fc.features[i].geometry;
      if (g && g.coordinates && g.coordinates.length) probe = firstCoord(g.coordinates);
    }
    if (!probe || Math.abs(probe[0]) <= 360) return fc;
    fc.features.forEach(function (f) {
      if (!f.geometry) return;
      f.geometry.coordinates = mapCoords(f.geometry.coordinates, function (p) {
        var x = p[0], y = p[1];
        if (x > 1e7) x -= 33e6;
        return utmToLatLon(x, y, 33);
      });
    });
    return fc;
  }

  function same(p, q) { return p[0] === q[0] && p[1] === q[1]; }

  // Fügt einzelne Linienstücke (Ways) zu geschlossenen Ringen zusammen
  function stitch(ways) {
    var rings = [], pool = ways.map(function (w) { return w.slice(); });
    while (pool.length) {
      var cur = pool.shift(), changed = true;
      while (changed && !same(cur[0], cur[cur.length - 1])) {
        changed = false;
        for (var i = 0; i < pool.length; i++) {
          var w = pool[i], a = cur[0], b = cur[cur.length - 1];
          if (same(b, w[0])) cur = cur.concat(w.slice(1));
          else if (same(b, w[w.length - 1])) cur = cur.concat(w.slice(0, -1).reverse());
          else if (same(a, w[w.length - 1])) cur = w.slice(0, -1).concat(cur);
          else if (same(a, w[0])) cur = w.slice(1).reverse().concat(cur);
          else continue;
          pool.splice(i, 1); changed = true; break;
        }
      }
      if (cur.length >= 3) {
        if (!same(cur[0], cur[cur.length - 1])) cur.push(cur[0]);
        if (cur.length >= 4) rings.push(cur);
      }
    }
    return rings;
  }

  function pointInRing(pt, ring) {
    var x = pt[0], y = pt[1], inside = false, i, j;
    for (i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      var xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  // polys: Liste von Polygonen, jedes = [außenring, loch, loch …]
  function pointInPolys(pt, polys) {
    for (var i = 0; i < polys.length; i++) {
      if (pointInRing(pt, polys[i][0])) {
        var hole = false;
        for (var k = 1; k < polys[i].length; k++) if (pointInRing(pt, polys[i][k])) { hole = true; break; }
        if (!hole) return true;
      }
    }
    return false;
  }
  function ringArea(r) {
    var s = 0, i, j;
    for (i = 0, j = r.length - 1; i < r.length; j = i++) s += (r[j][0] + r[i][0]) * (r[j][1] - r[i][1]);
    return Math.abs(s / 2);
  }
  function rnd(r) { return r.map(function (p) { return [Math.round(p[0] * 1e5) / 1e5, Math.round(p[1] * 1e5) / 1e5]; }); }

  // OSM-Relation (out geom) -> Liste von Polygonen
  function relToPolys(rel) {
    var outer = [], inner = [];
    (rel.members || []).forEach(function (m) {
      if (m.type !== 'way' || !m.geometry || m.geometry.length < 2) return;
      var line = m.geometry.map(function (g) { return [g.lon, g.lat]; });
      (m.role === 'inner' ? inner : outer).push(line);
    });
    var outers = stitch(outer), inners = stitch(inner);
    return outers.map(function (o) {
      var poly = [o];
      inners.forEach(function (h) { if (pointInRing(h[0], o)) poly.push(h); });
      return poly;
    });
  }

  function buildFromOverpass(json) {
    if (!json || !Array.isArray(json.elements)) throw new Error('unerwartete Antwort');
    var rels = json.elements.filter(function (e) { return e.type === 'relation' && e.tags && e.tags.name; });
    var bezRels = [], otRels = [];
    rels.forEach(function (r) {
      var lvl = String(r.tags.admin_level);
      if (lvl === '9') bezRels.push(r); else if (lvl === '10') otRels.push(r);
    });
    if (otRels.length < 10) throw new Error('zu wenige Ortsteile in der Antwort');

    var bezirke = bezRels.map(function (r, i) {
      return { name: r.tags.name.replace(/^(Stadtbezirk|Leipzig)[\s-]+/i, ''), polys: relToPolys(r) };
    }).sort(function (a, b) { return a.name < b.name ? -1 : 1; });

      '</div>' +
      '<label class="field">Gebiet<select id="selBez">' + bezOptions() + '</select></label>' +
      '<button class="btn big" id="goBtn" type="button">Spiel starten</button>' +
      '<p class="note" style="margin-top:12px">Oben rechts wechselst du die Hintergrundkarte und schaltest die 3D-Ansicht ein (Gebäude erscheinen ab Zoomstufe 13; mit gedrückter rechter Maustaste oder zwei Fingern kannst du die Karte drehen und neigen). Die Karten zeigen keine Ortsnamen.</p>' +
      dl +
      '<p class="note">Grenzen: © OpenStreetMap-Mitwirkende (ODbL). Karten: OpenFreeMap, Höhendaten: Mapzen/AWS.</p>'
    );
    $('goBtn').addEventListener('click', function () {
      startGame(document.querySelector('input[name="mode"]:checked').value);
    });
    var d = $('dlBtn');
    if (d) d.addEventListener('click', downloadData);
  }

  function downloadData() {
    if (!DATA) return;
    var blob = new Blob([JSON.stringify(DATA)], { type: 'application/geo+json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'ortsteile.geojson';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }

  function showResults(r) {
    var title = r.aborted ? 'Spiel beendet' : (r.pct >= 90 ? 'Ausgezeichnet!' : r.pct >= 60 ? 'Gut gemacht!' : 'Weiter üben!');
    var html =
      '<h2>' + title + '</h2>' +
      '<div class="score-big">' + r.pct + ' %</div>' +
      '<p>auf Anhieb richtig</p>' +
      '<div class="grid3">' +
        '<div><b>' + G.firstTry + ' / ' + G.total + '</b><span>Auf Anhieb</span></div>' +
        '<div><b>' + G.wrong + '</b><span>Fehlversuche</span></div>' +
        '<div><b>' + fmtTime(r.ms) + '</b><span>Zeit</span></div>' +
      '</div>';
    if (r.best && !r.aborted) {
      html += '<p class="note">' + (r.isNew ? '🏆 Neue Bestleistung!' : 'Bestleistung: ' + r.best.pct + ' % in ' + fmtTime(r.best.ms)) + '</p>';
    }
    if (G.missed.length) html += '<b>Zum Wiederholen (' + G.missed.length + '):</b><div class="chips" id="missedChips"></div>';
    html += '<div class="row">' +
      '<button class="btn" id="againBtn" type="button">Nochmal</button>' +
      (G.missed.length ? '<button class="btn sec" id="missedBtn" type="button">Nur Fehler üben</button>' : '') +
      '<button class="btn sec" id="menuBtn2" type="button">Menü</button></div>';
    showModal(html);
    var chips = $('missedChips');
    if (chips) G.missed.forEach(function (it) { var s = document.createElement('span'); s.textContent = it.name; chips.appendChild(s); });
    var mode = G.mode, bez = G.bez, missedItems = G.missed.slice();
    $('againBtn').addEventListener('click', function () { stopGame(); startGame(mode, { bez: bez }); });
    var mb = $('missedBtn');
    if (mb) mb.addEventListener('click', function () { stopGame(); startGame(mode, { only: missedItems }); });
    $('menuBtn2').addEventListener('click', function () { stopGame(); showStart(); });
  }

  /* =====================================================================
   *  Laden der Grenzdaten:  lokale Datei -> Browser-Cache -> OpenStreetMap
   * ===================================================================== */
  function showLoading(msg) {
    showModal('<h2>Karte wird geladen …</h2><div class="spinner" role="status"></div><p class="note" id="loadMsg">' + (msg || '') + '</p>');
  }
  function loadMsg(t) { var el = $('loadMsg'); if (el) el.textContent = t; }

  function fetchT(url, opts, ms) {
    opts = opts || {};
    if ('AbortController' in window) {
      var ctl = new AbortController(); opts.signal = ctl.signal;
      setTimeout(function () { ctl.abort(); }, ms);
    }
    return fetch(url, opts);
  }

  function tryLocal() {
    return fetchT(LOCAL_FILE, { cache: 'no-cache' }, 15000).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (fc) { return { pre: toPre(fc), src: 'local' }; });
  }
  function tryCache() {
    return new Promise(function (resolve, reject) {
      var raw = safeGet(CACHE_KEY);
      if (!raw) return reject(new Error('kein Cache'));
      try {
        var pre = JSON.parse(raw);
        if (pre.lpz !== 2 || !pre.features || pre.features.length < 10) throw new Error('Cache ungültig');
        resolve({ pre: pre, src: 'cache' });
      } catch (e) { reject(e); }
    });
  }
  function tryOverpass() {
    var i = 0;
    function next() {
      if (i >= OVERPASS.length) return Promise.reject(new Error('Overpass nicht erreichbar'));
      var url = OVERPASS[i++];
      loadMsg('Lade Grenzen aus OpenStreetMap (' + i + '/' + OVERPASS.length + ') …');
      return fetchT(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + encodeURIComponent(OVERPASS_QUERY)
      }, 70000).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (json) {
        var pre = buildFromOverpass(json);
        safeSet(CACHE_KEY, JSON.stringify(pre));
        return { pre: pre, src: 'osm' };
      }).catch(function (e) { console.warn('Overpass', url, e); return next(); });
    }
    return next();
  }

  function loadData() {
    showLoading('Lade Ortsteil-Grenzen …');
    tryLocal().catch(tryCache).catch(tryOverpass).then(function (res) {
      applyData(res.pre, res.src);
    }).catch(function (e) { console.error(e); showLoadError(); });
  }

  function applyData(pre, src) {
    try {
      DATA_SRC = src;
      buildItems(pre);
      ensureLayers();
      refreshStyles();
      var all = items.reduce(function (b, it) {
        return [[Math.min(b[0][0], it.bounds[0][0]), Math.min(b[0][1], it.bounds[0][1])],
                [Math.max(b[1][0], it.bounds[1][0]), Math.max(b[1][1], it.bounds[1][1])]];
      }, [[Infinity, Infinity], [-Infinity, -Infinity]]);
      map.fitBounds(all, { padding: 30, duration: 0 });
      showStart();
    } catch (e) { console.error(e); showLoadError(); }
  }

  function showLoadError() {
    showModal(
      '<h2 class="error">Daten konnten nicht geladen werden</h2>' +
      '<p>Die Ortsteil-Grenzen konnten weder aus OpenStreetMap noch aus einer lokalen Datei geladen werden. Bitte Internetverbindung prüfen und erneut versuchen.</p>' +
      '<div class="dropzone" id="drop"><input type="file" id="fileIn" accept=".json,.geojson,application/json"><p class="note">Alternativ eine GeoJSON-Datei auswählen oder hierher ziehen</p></div>' +
      '<button class="btn sec big" id="retryBtn" type="button">Erneut versuchen</button>'
    );
    function handleFile(file) {
      if (!file) return;
      var rd = new FileReader();
      rd.onload = function () {
        try { applyData(toPre(JSON.parse(rd.result)), 'file'); }
        catch (e) { alert('Die Datei konnte nicht gelesen werden: ' + e.message); }
      };
      rd.readAsText(file);
    }
    $('fileIn').addEventListener('change', function (e) { handleFile(e.target.files[0]); });
    var drop = $('drop');
    drop.addEventListener('dragover', function (e) { e.preventDefault(); });
    drop.addEventListener('drop', function (e) { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
    $('retryBtn').addEventListener('click', loadData);
  }

  loadData();
})();
</script>
</body>
</html>
