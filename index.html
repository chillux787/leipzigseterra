<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leipzig Ortsteile-Quiz</title>
<meta name="description" content="Lerne die 63 Ortsteile Leipzigs – ein Kartenquiz im Stil von Seterra.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0f1b2d;
    --panel: #ffffff;
    --ink: #14213d;
    --muted: #64748b;
    --accent: #e76f51;
    --accent-dark: #c9573b;
    --ok: #16a34a;
    --bad: #dc2626;
    --line: #e2e8f0;
    --radius: 14px;
    --shadow: 0 10px 30px rgba(15, 27, 45, .25);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; height: 100dvh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); background: var(--bg);
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #fbbf24; outline-offset: 2px; }

  /* ---------- Kopfzeile ---------- */
  #top {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--bg); color: #fff; min-height: 52px;
  }
  #top h1 { font-size: 1.05rem; margin: 0; letter-spacing: .2px; white-space: nowrap; }
  #top h1 span { color: #fbbf24; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; background: rgba(255,255,255,.12); border-radius: 999px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; color: #cbd5e1; padding: 6px 14px; border-radius: 999px; font-size: .88rem;
  }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 600; }
  .opacity { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: #cbd5e1; }
  .opacity input { width: 90px; accent-color: #fbbf24; }
  .ghost {
    border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff;
    padding: 6px 14px; border-radius: 999px; font-size: .88rem;
  }
  .ghost:hover { background: rgba(255,255,255,.12); }

  /* ---------- Karte ---------- */
  #stage { position: relative; flex: 1; min-height: 0; }
  #map { position: absolute; inset: 0; background: #dfe7ef; }
  .leaflet-container { font-family: inherit; }

  /* Ortsteil-Flächen */
  path.ot { transition: fill-opacity .15s; }
  path.target { stroke: #111 !important; stroke-width: 4px !important; fill: #fde047 !important; fill-opacity: .75 !important; animation: pulse .9s ease-in-out infinite alternate; }
  path.hint { stroke: #111 !important; stroke-width: 3px !important; fill-opacity: .8 !important; }
  @keyframes pulse { from { stroke-opacity: 1; } to { stroke-opacity: .35; } }

  .ot-label {
    background: rgba(255,255,255,.88); border: 0; box-shadow: 0 1px 3px rgba(0,0,0,.3);
    color: var(--ink); font-weight: 600; font-size: 10.5px; padding: 1px 5px; border-radius: 4px;
  }
  .ot-label::before { display: none; }
  .labels-off .ot-label.perm { display: none; }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; z-index: 1200; top: 12px; left: 12px; width: min(390px, calc(100% - 24px));
    background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px;
  }
  #hud[hidden], #modal[hidden], [hidden] { display: none !important; }
  .hud-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .prompt small { display: block; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .6px; }
  .prompt strong { font-size: 1.35rem; line-height: 1.15; }
  .stats { display: flex; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; font-size: .92rem; white-space: nowrap; }
  .stats .ok { color: var(--ok); font-weight: 700; }
  .stats .bad { color: var(--bad); font-weight: 700; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; margin: 10px 0 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  #feedback { min-height: 1.3em; font-size: .92rem; margin-bottom: 6px; }
  #feedback.bad { color: var(--bad); }
  #feedback.ok { color: var(--ok); }
  .hud-row { display: flex; gap: 8px; }
  .hud-row + .hud-row { margin-top: 8px; }
  #ans { flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border: 2px solid var(--line); border-radius: 10px; }
  #ans:focus { border-color: var(--accent); outline: none; }
  .btn {
    border: 0; border-radius: 10px; padding: 9px 14px; background: var(--accent); color: #fff; font-weight: 600;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn.sec { background: #eef2f7; color: var(--ink); font-weight: 500; }
  .btn.sec:hover { background: #e1e8f0; }
  .hud-row.buttons .btn { flex: 1; padding: 7px 8px; font-size: .86rem; }

  /* ---------- Modal ---------- */
  #modal {
    position: absolute; inset: 0; z-index: 1300; display: flex; align-items: center; justify-content: center;
    padding: 14px; background: rgba(15, 27, 45, .55); overflow: auto;
  }
  .card {
    background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); width: min(520px, 100%);
    padding: 24px; max-height: 100%; overflow: auto;
  }
  .card h2 { margin: 0 0 4px; font-size: 1.45rem; }
  .card p { color: var(--muted); margin: 4px 0 14px; line-height: 1.45; }
  .modes { display: grid; gap: 8px; margin: 12px 0; }
  .mode {
    display: flex; gap: 12px; align-items: flex-start; padding: 11px 13px; border: 2px solid var(--line);
    border-radius: 12px; cursor: pointer;
  }
  .mode:has(input:checked) { border-color: var(--accent); background: #fff4f0; }
  .mode input { margin-top: 4px; accent-color: var(--accent); }
  .mode b { display: block; }
  .mode span { color: var(--muted); font-size: .86rem; }
  .field { display: flex; flex-direction: column; gap: 5px; margin: 12px 0; font-size: .9rem; }
  .field select { font: inherit; padding: 9px 10px; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
  .check { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: .92rem; }
  .check input { accent-color: var(--accent); width: 17px; height: 17px; }
  .card .btn.big { width: 100%; padding: 13px; font-size: 1.05rem; margin-top: 10px; }
  .score-big { font-size: 3.4rem; font-weight: 800; line-height: 1; color: var(--accent); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; text-align: center; }
  .grid3 div { background: #f4f7fb; border-radius: 10px; padding: 8px 4px; }
  .grid3 b { display: block; font-size: 1.15rem; }
  .grid3 span { font-size: .76rem; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .chips span { background: #fee2e2; color: #991b1b; font-size: .82rem; padding: 3px 9px; border-radius: 99px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row .btn { flex: 1; }
  .note { font-size: .8rem; color: var(--muted); }
  .error { color: var(--bad); }
  .dropzone { border: 2px dashed var(--line); border-radius: 12px; padding: 14px; text-align: center; margin: 10px 0; }
  .spinner { width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 14px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .leaflet-bottom.leaflet-right { margin-bottom: 4px; }

  @media (max-width: 640px) {
    #top { gap: 8px; padding: 8px 10px; }
    #top h1 { font-size: .95rem; }
    .opacity { display: none; }
    #hud { top: auto; bottom: 26px; left: 8px; right: 8px; width: auto; }
    .prompt strong { font-size: 1.15rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    path.target { animation: none; }
  }
</style>
</head>
<body>

<header id="top">
  <h1>Leipzig <span>Ortsteile-Quiz</span></h1>
  <div class="spacer"></div>
  <div class="opacity"><label for="opac">Deckkraft</label><input id="opac" type="range" min="0" max="90" value="45"></div>
  <div class="seg" role="group" aria-label="Hintergrundkarte">
    <button id="bmTopo" type="button" aria-pressed="false">Topografisch</button>
    <button id="bmStyle" type="button" aria-pressed="true">Stilisiert</button>
  </div>
  <button id="menuBtn" class="ghost" type="button">Menü</button>
</header>

<main id="stage">
  <div id="map"></div>

  <section id="hud" hidden aria-live="polite">
    <div class="hud-top">
      <div class="prompt"><small id="promptLbl">Finde</small><strong id="target">–</strong></div>
      <div class="stats">
        <span class="ok" title="Auf Anhieb richtig">✔ <span id="sOk">0</span></span>
        <span class="bad" title="Fehlversuche">✖ <span id="sBad">0</span></span>
        <span id="sProg">0/0</span>
        <span id="sTime">0:00</span>
      </div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div id="feedback"></div>
    <div class="hud-row" id="typeRow" hidden>
      <input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Name des markierten Ortsteils …" aria-label="Name des markierten Ortsteils">
      <button id="submitBtn" class="btn" type="button">OK</button>
    </div>
    <div class="hud-row buttons">
      <button id="hintBtn" class="btn sec" type="button">Tipp</button>
      <button id="skipBtn" class="btn sec" type="button">Überspringen</button>
      <button id="labelBtn" class="btn sec" type="button" hidden>Namen an/aus</button>
      <button id="endBtn" class="btn sec" type="button">Beenden</button>
    </div>
  </section>

  <div id="modal">
    <div class="card" id="card"></div>
  </div>
</main>

<noscript><p style="color:#fff;padding:20px">Dieses Spiel benötigt JavaScript.</p></noscript>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  'use strict';

  /* =====================================================================
   *  Konfiguration
   * ===================================================================== */
  // Amtliche Ortsteilgrenzen (Stadt Leipzig, Amt für Statistik und Wahlen, dl-de/by-2-0)
  var REMOTE_URL = 'https://static.leipzig.de/fileadmin/mediendatenbank/leipzig-de/Stadt/02.1_Dez1_Allgemeine_Verwaltung/12_Statistik_und_Wahlen/Geodaten/Ortsteile_Leipzig_UTM33N.json';
  // Lade-Reihenfolge: 1. lokale Datei neben index.html, 2. direkt von der Stadt, 3. über CORS-Proxy
  var SOURCES = [
    'ortsteile.geojson',
    REMOTE_URL,
    'https://corsproxy.io/?url=' + encodeURIComponent(REMOTE_URL)
  ];
  var MAX_TRIES = 3;

  // Stadtbezirke (Schlüsselnummer 0–9) mit ihren Ortsteilen (Schlüsselnummer = Bezirk*10 + Index)
  var BEZIRKE = [
    { name: 'Mitte',    color: '#e76f51', ot: ['Zentrum', 'Zentrum-Ost', 'Zentrum-Südost', 'Zentrum-Süd', 'Zentrum-West', 'Zentrum-Nordwest', 'Zentrum-Nord'] },
    { name: 'Nordost',  color: '#2a9d8f', ot: ['Schönefeld-Abtnaundorf', 'Schönefeld-Ost', 'Mockau-Süd', 'Mockau-Nord', 'Thekla', 'Plaußig-Portitz'] },
    { name: 'Ost',      color: '#e9c46a', ot: ['Neustadt-Neuschönefeld', 'Volkmarsdorf', 'Anger-Crottendorf', 'Sellerhausen-Stünz', 'Paunsdorf', 'Heiterblick', 'Mölkau', 'Engelsdorf', 'Baalsdorf', 'Althen-Kleinpösna'] },
    { name: 'Südost',   color: '#8ab17d', ot: ['Reudnitz-Thonberg', 'Stötteritz', 'Probstheida', 'Meusdorf', 'Liebertwolkwitz', 'Holzhausen'] },
    { name: 'Süd',      color: '#4d908e', ot: ['Südvorstadt', 'Connewitz', 'Marienbrunn', 'Lößnig', 'Dölitz-Dösen'] },
    { name: 'Südwest',  color: '#9b72aa', ot: ['Schleußig', 'Plagwitz', 'Kleinzschocher', 'Großzschocher', 'Knautkleeberg-Knauthain', 'Hartmannsdorf-Knautnaundorf'] },
    { name: 'West',     color: '#f4a261', ot: ['Schönau', 'Grünau-Ost', 'Grünau-Mitte', 'Grünau-Siedlung', 'Lausen-Grünau', 'Grünau-Nord', 'Miltitz'] },
    { name: 'Alt-West', color: '#577590', ot: ['Lindenau', 'Altlindenau', 'Neulindenau', 'Leutzsch', 'Böhlitz-Ehrenberg', 'Burghausen-Rückmarsdorf'] },
    { name: 'Nordwest', color: '#c1666b', ot: ['Möckern', 'Wahren', 'Lützschena-Stahmeln', 'Lindenthal'] },
    { name: 'Nord',     color: '#6d9dc5', ot: ['Gohlis-Süd', 'Gohlis-Mitte', 'Gohlis-Nord', 'Eutritzsch', 'Seehausen', 'Wiederitzsch'] }
  ];

  /* =====================================================================
   *  Hilfsfunktionen
   * ===================================================================== */
  function $(id) { return document.getElementById(id); }

  function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function safeSet(key, val) { try { localStorage.setItem(key, val); } catch (e) { /* ignorieren */ } }

  // "Grünau-Süd" -> "gruenausued" (für Vergleiche)
  function norm(s) {
    return String(s).toLowerCase().replace(/ß/g, 'ss').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/[^a-z0-9]/g, '');
  }
  // "Grünau-Süd" -> "grunausud" (Tippen ohne Umlaute)
  function norm2(s) {
    return String(s).toLowerCase().replace(/ß/g, 'ss').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
  }
  function lev(a, b) {
    var m = a.length, n = b.length, i, j, prev, cur, tmp;
    if (!m) return n; if (!n) return m;
    prev = []; for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur = [i];
      for (j = 1; j <= n; j++) {
        tmp = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + tmp);
      }
      prev = cur;
    }
    return prev[n];
  }
  function tolerance(len) { return len >= 12 ? 2 : (len >= 5 ? 1 : 0); }
  function similar(typed, target) {
    var ts = [norm(typed), norm2(typed)], gs = [norm(target), norm2(target)], i, j;
    for (i = 0; i < ts.length; i++) {
      for (j = 0; j < gs.length; j++) {
        if (ts[i] && lev(ts[i], gs[j]) <= tolerance(gs[j].length)) return true;
      }
    }
    return false;
  }
  function exactly(typed, target) {
    return norm(typed) === norm(target) || norm2(typed) === norm2(target);
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function fmtTime(ms) {
    var s = Math.floor(ms / 1000), m = Math.floor(s / 60);
    s = s % 60; return m + ':' + (s < 10 ? '0' : '') + s;
  }

  /* =====================================================================
   *  Koordinaten: UTM33N (ETRS89) -> WGS84 (ohne Zusatzbibliothek)
   * ===================================================================== */
  function utmToLatLon(E, N, zone) {
    var a = 6378137.0, f = 1 / 298.257222101, k0 = 0.9996;
    var e2 = f * (2 - f), ep2 = e2 / (1 - e2);
    var x = E - 500000.0, y = N;
    var M = y / k0;
    var mu = M / (a * (1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 * e2 * e2 / 256));
    var e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
    var phi1 = mu
      + (3 * e1 / 2 - 27 * Math.pow(e1, 3) / 32) * Math.sin(2 * mu)
      + (21 * e1 * e1 / 16 - 55 * Math.pow(e1, 4) / 32) * Math.sin(4 * mu)
      + (151 * Math.pow(e1, 3) / 96) * Math.sin(6 * mu)
      + (1097 * Math.pow(e1, 4) / 512) * Math.sin(8 * mu);
    var s = Math.sin(phi1), c = Math.cos(phi1), t = Math.tan(phi1);
    var N1 = a / Math.sqrt(1 - e2 * s * s);
    var T1 = t * t, C1 = ep2 * c * c;
    var R1 = a * (1 - e2) / Math.pow(1 - e2 * s * s, 1.5);
    var D = x / (N1 * k0);
    var lat = phi1 - (N1 * t / R1) * (D * D / 2
      - (5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * ep2) * Math.pow(D, 4) / 24
      + (61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 252 * ep2 - 3 * C1 * C1) * Math.pow(D, 6) / 720);
    var lon0 = ((zone || 33) * 6 - 183) * Math.PI / 180;
    var lon = lon0 + (D
      - (1 + 2 * T1 + C1) * Math.pow(D, 3) / 6
      + (5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * ep2 + 24 * T1 * T1) * Math.pow(D, 5) / 120) / c;
    return [lon * 180 / Math.PI, lat * 180 / Math.PI];
  }
  function firstCoord(c) { while (Array.isArray(c[0])) c = c[0]; return c; }
  function mapCoords(c, fn) { return typeof c[0] === 'number' ? fn(c) : c.map(function (x) { return mapCoords(x, fn); }); }

  // Erkennt projizierte Koordinaten und rechnet sie bei Bedarf nach WGS84 um
  function ensureWgs84(fc) {
    var probe = null, i, g;
    for (i = 0; i < fc.features.length && !probe; i++) {
      g = fc.features[i].geometry;
      if (g && g.coordinates && g.coordinates.length) probe = firstCoord(g.coordinates);
    }
    if (!probe || Math.abs(probe[0]) <= 360) return fc;   // bereits Grad
    fc.features.forEach(function (f) {
      if (!f.geometry) return;
      f.geometry.coordinates = mapCoords(f.geometry.coordinates, function (p) {
        var x = p[0], y = p[1];
        if (x > 1e7) x -= 33e6;           // Variante mit vorangestellter Zonennummer (33xxxxxx)
        return utmToLatLon(x, y, 33);
      });
    });
    return fc;
  }

  /* =====================================================================
   *  Karte & Hintergrundkarten
   * ===================================================================== */
  var map = L.map('map', { zoomSnap: 0.25, zoomDelta: 0.5, minZoom: 9, maxZoom: 17, zoomControl: false })
    .setView([51.34, 12.375], 11);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  var baseLayers = {
    // Topografisch ohne Beschriftungen: Esri-Geländekarte + Schummerung (beide ohne Ortsnamen)
    topo: L.layerGroup([
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 17, maxNativeZoom: 13,
        attribution: 'Tiles © Esri — Source: USGS, Esri, TANA, DeLorme, NGA'
      }),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 17, maxNativeZoom: 16, opacity: 0.55
      })
    ]),
    style: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
      maxZoom: 17, subdomains: 'abcd',
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende © <a href="https://carto.com/attributions">CARTO</a>'
    })
  };
  var currentBase = null;
  function setBase(key) {
    if (currentBase) map.removeLayer(baseLayers[currentBase]);
    baseLayers[key].addTo(map).bringToBack();
    currentBase = key;
    $('bmTopo').setAttribute('aria-pressed', key === 'topo');
    $('bmStyle').setAttribute('aria-pressed', key === 'style');
    safeSet('lpz-base', key);
    refreshStyles();
  }
  $('bmTopo').addEventListener('click', function () { setBase('topo'); });
  $('bmStyle').addEventListener('click', function () { setBase('style'); });

  map.on('zoomend', function () {
    map.getContainer().classList.toggle('labels-off', map.getZoom() < 11);
  });

  /* =====================================================================
   *  Daten
   * ===================================================================== */
  var items = [];           // { name, bez, code, layer, state, inPool }
  var geoGroup = null;
  var fillOpacity = 0.45;

  var byNorm = {}, byCode = {};
  BEZIRKE.forEach(function (b, bi) {
    b.ot.forEach(function (n, i) {
      var rec = { name: n, bez: bi, code: bi * 10 + i };
      byNorm[norm(n)] = rec; byCode[rec.code] = rec;
    });
  });

  function pickName(p) {
    var keys = ['Name', 'NAME', 'name', 'OT_NAME', 'Ortsteil', 'ORTSTEIL', 'ortsteil'], i;
    for (i = 0; i < keys.length; i++) if (p[keys[i]] != null && p[keys[i]] !== '') return String(p[keys[i]]);
    for (var k in p) if (typeof p[k] === 'string' && isNaN(Number(p[k]))) return p[k];
    return null;
  }
  function pickCode(p) {
    var keys = ['OT', 'OT_NR', 'Nr', 'NR', 'ot', 'Ortsteil_Nr'], i, v;
    for (i = 0; i < keys.length; i++) {
      v = parseInt(p[keys[i]], 10);
      if (!isNaN(v)) return v;
    }
    return null;
  }

  function buildLayers(fc) {
    if (geoGroup) map.removeLayer(geoGroup);
    items = [];
    var seen = {};
    geoGroup = L.geoJSON(fc, {
      style: function () { return { weight: 1.4, color: '#0f172a', opacity: 0.75, fillOpacity: fillOpacity, className: 'ot' }; },
      onEachFeature: function (feature, layer) {
        var p = feature.properties || {};
        var rawName = pickName(p), code = pickCode(p);
        var rec = (rawName && byNorm[norm(rawName)]) || (code != null && byCode[code]) || null;
        var bez = rec ? rec.bez : (code != null ? Math.floor(code / 10) : 0);
        if (bez < 0 || bez > 9) bez = 0;
        var name = rec ? rec.name : (rawName || 'Ortsteil ' + code);
        var key = norm(name);
        if (seen[key]) {                       // zusammengehörige Teilflächen nicht doppelt zählen
          layer.__dup = seen[key];
          seen[key].extra.push(layer);
          bindLayerEvents(layer, seen[key]);
          return;
        }
        var item = { name: name, bez: bez, code: code, layer: layer, extra: [], state: 'idle', inPool: true };
        seen[key] = item; items.push(item);
        bindLayerEvents(layer, item);
      }
    }).addTo(map);
    refreshStyles();
    var b = geoGroup.getBounds();
    if (b.isValid()) {
      map.fitBounds(b, { padding: [24, 24] });
      map.setMaxBounds(b.pad(0.8));
    }
    map.fire('zoomend');
  }

  function layersOf(item) { return [item.layer].concat(item.extra || []); }

  function styleFor(item) {
    var base = { weight: 1.4, color: '#0f172a', opacity: 0.75 };
    if (!item.inPool) { base.fillColor = '#94a3b8'; base.fillOpacity = Math.min(fillOpacity, 0.25); return base; }
    if (item.state === 'ok')     { base.fillColor = '#22c55e'; base.fillOpacity = Math.max(fillOpacity, 0.55); return base; }
    if (item.state === 'missed') { base.fillColor = '#f59e0b'; base.fillOpacity = Math.max(fillOpacity, 0.55); return base; }
    base.fillColor = BEZIRKE[item.bez].color; base.fillOpacity = fillOpacity;
    return base;
  }
  function applyStyle(item) { layersOf(item).forEach(function (l) { l.setStyle(styleFor(item)); }); }
  function refreshStyles() { items.forEach(applyStyle); }

  $('opac').addEventListener('input', function (e) {
    fillOpacity = Number(e.target.value) / 100;
    refreshStyles();
  });

  /* ---------- Beschriftungen ---------- */
  function setLabel(item, mode) {   // 'none' | 'hover' | 'perm'
    layersOf(item).forEach(function (l, idx) {
      l.unbindTooltip();
      if (mode === 'none') return;
      if (mode === 'perm' && idx > 0) return;
      var txt = mode === 'hover' ? item.name + ' (Stadtbezirk ' + BEZIRKE[item.bez].name + ')' : item.name;
      l.bindTooltip(txt, mode === 'perm'
        ? { permanent: true, direction: 'center', className: 'ot-label perm', opacity: 1 }
        : { sticky: true, direction: 'top', className: 'ot-label', opacity: 1 });
      if (mode === 'perm') l.openTooltip();
    });
  }

  /* =====================================================================
   *  Spielzustand
   * ===================================================================== */
  var G = null;   // aktuelles Spiel
  var learnLabels = false;

  function bindLayerEvents(layer, item) {
    layer.on('click', function () { onLayerClick(item); });
    layer.on('mouseover', function () {
      if (G && G.mode !== 'learn' && item.inPool && item.state === 'idle') layer.setStyle({ weight: 2.6 });
    });
    layer.on('mouseout', function () { if (G) applyStyle(item); });
  }

  function clearMarks() {
    items.forEach(function (it) {
      layersOf(it).forEach(function (l) {
        var el = l.getElement && l.getElement();
        if (el) el.classList.remove('target', 'hint');
      });
    });
  }

  function resetItems(pool) {
    items.forEach(function (it) {
      it.state = 'idle';
      it.inPool = !pool || pool.indexOf(it) !== -1;
      setLabel(it, 'none');
    });
    clearMarks();
    refreshStyles();
  }

  function startGame(mode, opts) {
    opts = opts || {};
    var bezFilter = opts.bez != null ? opts.bez : $('selBez') ? $('selBez').value : 'all';
    var pool = items.filter(function (it) {
      if (opts.only) return opts.only.indexOf(it) !== -1;
      return bezFilter === 'all' || String(it.bez) === String(bezFilter);
    });
    if (!pool.length) return;
    var showNames = $('chkNames') ? $('chkNames').checked : true;
    resetItems(mode === 'learn' ? null : pool);

    G = {
      mode: mode, bez: bezFilter, pool: pool, queue: shuffle(pool.slice()), total: pool.length,
      done: 0, firstTry: 0, wrong: 0, missed: [], current: null, attempts: 0, usedHint: false,
      locked: false, start: Date.now(), timer: null, showNames: showNames, ended: false
    };

    hideModal();
    $('hud').hidden = false;
    $('typeRow').hidden = mode !== 'type';
    $('hintBtn').hidden = mode !== 'find';
    $('skipBtn').hidden = mode === 'learn';
    $('labelBtn').hidden = mode !== 'learn';
    $('barFill').style.width = '0%';
    $('sOk').textContent = '0'; $('sBad').textContent = '0';
    $('sProg').textContent = '0/' + G.total;
    $('sTime').textContent = '0:00';
    $('feedback').textContent = ''; $('feedback').className = '';

    if (mode === 'learn') {
      $('promptLbl').textContent = 'Lernmodus';
      $('target').textContent = 'Fahre / tippe über die Karte';
      $('barFill').style.width = '0%';
      learnLabels = false;
      items.forEach(function (it) { setLabel(it, 'hover'); });
      G.timer = null;
      $('sProg').textContent = G.total + ' Ortsteile';
      $('sTime').textContent = '';
      $('sOk').parentNode.hidden = true; $('sBad').parentNode.hidden = true;
      return;
    }
    $('sOk').parentNode.hidden = false; $('sBad').parentNode.hidden = false;

    G.timer = setInterval(function () { $('sTime').textContent = fmtTime(Date.now() - G.start); }, 250);
    nextQuestion();
  }

  function nextQuestion() {
    clearMarks();
    if (!G.queue.length) { finishGame(); return; }
    G.current = G.queue.shift();
    G.attempts = 0; G.usedHint = false; G.locked = false;
    var it = G.current;
    if (G.mode === 'find') {
      $('promptLbl').textContent = 'Finde den Ortsteil';
      $('target').textContent = it.name;
    } else {
      $('promptLbl').textContent = 'Wie heißt der markierte Ortsteil?';
      $('target').textContent = '?';
      markTarget(it);
      var ans = $('ans'); ans.value = ''; ans.focus({ preventScroll: true });
    }
  }

  function markTarget(it) {
    layersOf(it).forEach(function (l) {
      var el = l.getElement && l.getElement();
      if (el) el.classList.add('target');
      l.bringToFront();
    });
    var b = L.featureGroup(layersOf(it)).getBounds();
    if (!map.getBounds().contains(b)) map.flyToBounds(b, { maxZoom: 13, padding: [60, 60] });
  }

  function feedback(text, cls) {
    var f = $('feedback'); f.textContent = text; f.className = cls || '';
  }

  function updateStats() {
    $('sOk').textContent = G.firstTry; $('sBad').textContent = G.wrong;
    $('sProg').textContent = G.done + '/' + G.total;
    $('barFill').style.width = (G.done / G.total * 100) + '%';
  }

  function markDone(it, ok) {
    it.state = ok ? 'ok' : 'missed';
    applyStyle(it);
    if (G.showNames) setLabel(it, 'perm');
    G.done++;
    if (ok && G.attempts === 0 && !G.usedHint) G.firstTry++;
    if (!ok || G.attempts > 0 || G.usedHint) { if (G.missed.indexOf(it) === -1) G.missed.push(it); }
    updateStats();
  }

  function reveal(it, msg) {
    G.locked = true;
    clearMarks();
    if (G.mode === 'type') $('target').textContent = it.name;
    layersOf(it).forEach(function (l) {
      var el = l.getElement && l.getElement(); if (el) el.classList.add('target'); l.bringToFront();
    });
    feedback(msg, 'bad');
    markDone(it, false);
    setTimeout(function () { if (G && !G.ended) nextQuestion(); }, 1500);
  }

  function correct(it) {
    G.locked = true;
    feedback(G.attempts === 0 && !G.usedHint ? 'Richtig! ✔' : 'Richtig – aber nicht auf Anhieb.', 'ok');
    clearMarks();
    markDone(it, true);
    setTimeout(function () { if (G && !G.ended) nextQuestion(); }, 600);
  }

  function wrongTry(clicked) {
    G.attempts++; G.wrong++;
    $('sBad').textContent = G.wrong;
    if (clicked) {
      clicked.layers.forEach(function (l) { l.setStyle({ fillColor: '#ef4444', fillOpacity: 0.8 }); });
      setTimeout(function () { applyStyle(clicked.item); }, 600);
    }
    if (G.attempts >= MAX_TRIES) {
      reveal(G.current, 'Leider nicht gefunden: ' + G.current.name);
    } else {
      var left = MAX_TRIES - G.attempts;
      feedback((clicked ? 'Das war: ' + clicked.item.name + '. ' : 'Nicht ganz. ') + 'Noch ' + left + (left === 1 ? ' Versuch.' : ' Versuche.'), 'bad');
    }
  }

  function onLayerClick(item) {
    if (!G || G.ended) return;
    if (G.mode === 'learn') {
      var l = item.layer; l.openTooltip && l.openTooltip();
      $('target').textContent = item.name;
      $('promptLbl').textContent = 'Stadtbezirk ' + BEZIRKE[item.bez].name;
      return;
    }
    if (G.mode !== 'find' || G.locked || !item.inPool || item.state !== 'idle') return;
    if (item === G.current) correct(item);
    else wrongTry({ item: item, layers: layersOf(item) });
  }

  /* ---------- Tippen ---------- */
  function submitTyped() {
    if (!G || G.mode !== 'type' || G.locked) return;
    var typed = $('ans').value.trim();
    if (!typed) return;
    var target = G.current;
    var ok = exactly(typed, target.name);
    if (!ok) {
      var other = G.pool.some(function (it) { return it !== target && exactly(typed, it.name); });
      if (!other) ok = similar(typed, target.name);
    }
    if (ok) {
      $('target').textContent = target.name;
      correct(target);
    } else {
      wrongTry(null);
      if (!G.locked) { $('ans').select(); }
    }
  }
  $('submitBtn').addEventListener('click', submitTyped);
  $('ans').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submitTyped(); } });

  /* ---------- Steuerung ---------- */
  $('skipBtn').addEventListener('click', function () {
    if (!G || G.locked || G.mode === 'learn') return;
    if (G.mode === 'type') $('target').textContent = G.current.name;
    reveal(G.current, 'Übersprungen: ' + G.current.name);
  });

  $('hintBtn').addEventListener('click', function () {
    if (!G || G.locked || G.mode !== 'find') return;
    G.usedHint = true;
    var cur = G.current;
    var group = items.filter(function (it) { return it.bez === cur.bez; });
    var layers = [];
    group.forEach(function (it) { layers = layers.concat(layersOf(it)); });
    layers.forEach(function (l) { var el = l.getElement && l.getElement(); if (el) el.classList.add('hint'); });
    feedback('Tipp: Gesucht ist im Stadtbezirk ' + BEZIRKE[cur.bez].name + ' (hervorgehoben).', '');
    setTimeout(function () {
      layers.forEach(function (l) { var el = l.getElement && l.getElement(); if (el) el.classList.remove('hint'); });
    }, 2200);
  });

  $('labelBtn').addEventListener('click', function () {
    learnLabels = !learnLabels;
    items.forEach(function (it) { setLabel(it, learnLabels ? 'perm' : 'hover'); });
  });

  $('endBtn').addEventListener('click', function () {
    if (!G) return;
    if (G.mode === 'learn') { stopGame(); showStart(); return; }
    finishGame(true);
  });
  $('menuBtn').addEventListener('click', function () { if (G && G.mode !== 'learn' && !G.ended) { if (!confirm('Aktuelles Spiel abbrechen?')) return; } stopGame(); showStart(); });

  function stopGame() {
    if (G && G.timer) clearInterval(G.timer);
    G = null;
    $('hud').hidden = true;
    clearMarks();
    resetItems(null);
  }

  function finishGame(aborted) {
    if (!G || G.ended) return;
    G.ended = true;
    clearInterval(G.timer);
    var ms = Date.now() - G.start;
    clearMarks();
    // nicht beantwortete Ortsteile bei Abbruch als verpasst markieren
    if (aborted) {
      G.queue.concat(G.current && G.current.state === 'idle' ? [G.current] : []).forEach(function (it) {
        if (G.missed.indexOf(it) === -1) G.missed.push(it);
      });
    }
    var pct = Math.round(G.firstTry / G.total * 100);
    var key = 'lpz-best-' + G.mode + '-' + G.bez;
    var best = null;
    try { best = JSON.parse(safeGet(key)); } catch (e) { best = null; }
    var isNew = false;
    if (!aborted && (!best || pct > best.pct || (pct === best.pct && ms < best.ms))) {
      safeSet(key, JSON.stringify({ pct: pct, ms: ms })); isNew = true;
      best = { pct: pct, ms: ms };
    }
    $('hud').hidden = true;
    showResults({ pct: pct, ms: ms, aborted: aborted, best: best, isNew: isNew });
  }

  /* =====================================================================
   *  Dialoge
   * ===================================================================== */
  function hideModal() { $('modal').hidden = true; }
  function showModal(html) { $('card').innerHTML = html; $('modal').hidden = false; }

  function bezOptions() {
    var o = '<option value="all">Alle 10 Stadtbezirke (' + items.length + ' Ortsteile)</option>';
    BEZIRKE.forEach(function (b, i) {
      var n = items.filter(function (it) { return it.bez === i; }).length;
      o += '<option value="' + i + '">Stadtbezirk ' + b.name + ' (' + n + ')</option>';
    });
    return o;
  }

  function showStart() {
    showModal(
      '<h2>Leipzig Ortsteile-Quiz</h2>' +
      '<p>Wie gut kennst du die Ortsteile Leipzigs? Du hast pro Ortsteil ' + MAX_TRIES + ' Versuche. Gewertet wird, was auf Anhieb richtig war.</p>' +
      '<div class="modes">' +
        '<label class="mode"><input type="radio" name="mode" value="find" checked><div><b>Finden</b><span>Ein Name wird genannt – klicke den Ortsteil auf der Karte an.</span></div></label>' +
        '<label class="mode"><input type="radio" name="mode" value="type"><div><b>Tippen</b><span>Ein Ortsteil ist markiert – tippe seinen Namen ein.</span></div></label>' +
        '<label class="mode"><input type="radio" name="mode" value="learn"><div><b>Lernen</b><span>Freies Erkunden mit Namen beim Überfahren, ohne Wertung.</span></div></label>' +
      '</div>' +
      '<label class="field">Gebiet<select id="selBez">' + bezOptions() + '</select></label>' +
      '<label class="check"><input type="checkbox" id="chkNames" checked> Namen nach der Antwort auf der Karte anzeigen</label>' +
      '<button class="btn big" id="goBtn" type="button">Spiel starten</button>' +
      '<p class="note" style="margin-top:12px">Tipp: Oben rechts kannst du zwischen topografischer und stilisierter Hintergrundkarte wechseln. Beide Karten kommen ohne Ortsnamen aus.</p>' +
      '<p class="note">Geodaten: Stadt Leipzig, Amt für Statistik und Wahlen (Datenlizenz Deutschland – Namensnennung 2.0).</p>'
    );
    $('goBtn').addEventListener('click', function () {
      var mode = document.querySelector('input[name="mode"]:checked').value;
      startGame(mode);
    });
  }

  function showResults(r) {
    var title = r.aborted ? 'Spiel beendet' : (r.pct >= 90 ? 'Ausgezeichnet!' : r.pct >= 60 ? 'Gut gemacht!' : 'Weiter üben!');
    var html =
      '<h2>' + title + '</h2>' +
      '<div class="score-big">' + r.pct + ' %</div>' +
      '<p>auf Anhieb richtig</p>' +
      '<div class="grid3">' +
        '<div><b>' + G.firstTry + ' / ' + G.total + '</b><span>Auf Anhieb</span></div>' +
        '<div><b>' + G.wrong + '</b><span>Fehlversuche</span></div>' +
        '<div><b>' + fmtTime(r.ms) + '</b><span>Zeit</span></div>' +
      '</div>';
    if (r.best && !r.aborted) {
      html += '<p class="note">' + (r.isNew ? '🏆 Neue Bestleistung!' : 'Bestleistung: ' + r.best.pct + ' % in ' + fmtTime(r.best.ms)) + '</p>';
    }
    if (G.missed.length) {
      html += '<b>Zum Wiederholen (' + G.missed.length + '):</b><div class="chips" id="missedChips"></div>';
    }
    html += '<div class="row">' +
      '<button class="btn" id="againBtn" type="button">Nochmal</button>' +
      (G.missed.length ? '<button class="btn sec" id="missedBtn" type="button">Nur Fehler üben</button>' : '') +
      '<button class="btn sec" id="menuBtn2" type="button">Menü</button></div>';
    showModal(html);
    var chips = $('missedChips');
    if (chips) G.missed.forEach(function (it) { var s = document.createElement('span'); s.textContent = it.name; chips.appendChild(s); });
    var mode = G.mode, bez = G.bez, missedItems = G.missed.slice();
    $('againBtn').addEventListener('click', function () { var m = mode; var b = bez; stopGame(); startGame(m, { bez: b }); });
    var mb = $('missedBtn');
    if (mb) mb.addEventListener('click', function () { var m = mode; stopGame(); startGame(m, { only: missedItems }); });
    $('menuBtn2').addEventListener('click', function () { stopGame(); showStart(); });
  }

  /* =====================================================================
   *  Laden der Daten
   * ===================================================================== */
  function showLoading(msg) {
    showModal('<h2>Karte wird geladen …</h2><div class="spinner" role="status"></div><p class="note" id="loadMsg">' + (msg || '') + '</p>');
  }

  function fetchJson(url) {
    return fetch(url, { cache: 'force-cache' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  function validFc(fc) {
    return fc && fc.type === 'FeatureCollection' && Array.isArray(fc.features) && fc.features.length >= 10;
  }

  function loadData() {
    showLoading('Lade Ortsteil-Grenzen …');
    var i = 0;
    function attempt() {
      if (i >= SOURCES.length) return Promise.reject(new Error('keine Quelle erreichbar'));
      var url = SOURCES[i++];
      return fetchJson(url).then(function (fc) {
        if (!validFc(fc)) throw new Error('ungültiges GeoJSON');
        return fc;
      }).catch(function () { return attempt(); });
    }
    attempt().then(onData).catch(showLoadError);
  }

  function onData(fc) {
    try {
      fc = ensureWgs84(fc);
      buildLayers(fc);
      showStart();
    } catch (e) {
      console.error(e);
      showLoadError(e);
    }
  }

  function showLoadError() {
    showModal(
      '<h2 class="error">Daten konnten nicht geladen werden</h2>' +
      '<p>Die Ortsteil-Grenzen der Stadt Leipzig sind vom Server nicht abrufbar (vermutlich blockiert der Browser den Zugriff). So klappt es trotzdem:</p>' +
      '<ol style="line-height:1.6;color:#334155">' +
        '<li>Datei herunterladen: <a href="' + REMOTE_URL + '" target="_blank" rel="noopener">Ortsteile_Leipzig_UTM33N.json</a></li>' +
        '<li>Entweder hier auswählen/hineinziehen …</li>' +
        '<li>… oder dauerhaft als <code>ortsteile.geojson</code> neben die <code>index.html</code> ins Repository legen.</li>' +
      '</ol>' +
      '<div class="dropzone" id="drop"><input type="file" id="fileIn" accept=".json,.geojson,application/json"><p class="note">oder Datei hierher ziehen</p></div>' +
      '<button class="btn sec big" id="retryBtn" type="button">Erneut versuchen</button>'
    );
    function handleFile(file) {
      if (!file) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var fc = JSON.parse(rd.result);
          if (!validFc(fc)) throw new Error('kein gültiges GeoJSON');
          onData(fc);
        } catch (e) { alert('Die Datei konnte nicht gelesen werden: ' + e.message); }
      };
      rd.readAsText(file);
    }
    $('fileIn').addEventListener('change', function (e) { handleFile(e.target.files[0]); });
    var drop = $('drop');
    drop.addEventListener('dragover', function (e) { e.preventDefault(); });
    drop.addEventListener('drop', function (e) { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
    $('retryBtn').addEventListener('click', loadData);
  }

  /* =====================================================================
   *  Start
   * ===================================================================== */
  setBase(safeGet('lpz-base') === 'topo' ? 'topo' : 'style');
  loadData();
})();
</script>
</body>
</html>
